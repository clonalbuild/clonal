plugins {
    id 'scala'
    id 'application'
}

dependencies {
    implementation 'com.lihaoyi:pprint_3:0.9.6'
    implementation 'org.scala-lang:scala3-library_3:3.3.9'
    implementation 'com.monovore:decline_3:2.6.2'
    implementation project(':clonal')

    testImplementation 'org.scalameta:munit_3:1.3.6'
}

application {
    mainClass = 'org.clonalbuild.cli.Main'
    applicationName = 'clonal'
}

tasks.named('test') {
    useJUnit()
}
