plugins {
    id 'base'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21' apply false
}

subprojects {
    repositories {
        mavenCentral()
    }

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
    }
}
